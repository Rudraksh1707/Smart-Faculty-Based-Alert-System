spring.application.name=faculty-alert

# Server Configuration
server.port=8080

# CORS Global settings handled in config
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# Database connection (H2 for smooth testing)
spring.datasource.url=jdbc:h2:mem:facultyalert;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Email configuration (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-college-email@gmail.com
spring.mail.password=your-app-password-here
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.debug=true

# Telegram Bot Token
telegram.bot.token=8524620267:AAFLM3GzDMAIgKEeBLumSd0OogGlNj7dMps

# WhatsApp configuration (Twilio)
# Set enabled to false to skip WhatsApp alerts while you set up your account
twilio.enabled=false
twilio.account.sid=ACxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
twilio.auth.token=your_auth_token_here
twilio.whatsapp.number=whatsapp:+14155238886

